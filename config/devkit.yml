runtime:
  root: ${RUNTIME_ROOT}

repositories:
  ruby: ${RUBY_ROOT}
  front: ${FRONT_ROOT}
  infra: ${INFRA_ROOT}

database:
  name: mitsubachi_ruby_development
  url: postgresql:///mitsubachi_ruby_development

health_timeout: 30
stop_timeout: 10

required_commands:
  - ruby
  - bundle
  - node
  - npm
  - psql
  - pg_isready
  - nginx
  - mailpit
  - ffmpeg
  - php

adminer:
  version: "5.5.1"
  url: https://www.adminer.org/static/download/5.5.1/adminer-5.5.1.php
  sha256: f2c70c6403a042d554be1dd8d69b6f6270a97e5b40d2fb7626f46aad821e9a18

startup_order:
  - mailpit
  - ruby
  - front
  - nginx
  - adminer

services:
  ruby:
    cwd: ${RUBY_ROOT}
    command:
      - bin/rails
      - server
      - -b
      - 127.0.0.1
      - -p
      - "3001"
    port: 3001
    healthcheck: http://127.0.0.1:3001/api/health/ready
    env:
      RAILS_ENV: development
      RACK_ENV: development
      PORT: "3001"
      FILE_STORAGE_ROOT: ${RUNTIME_ROOT}/storage
      MITSUBACHI_STORAGE_ROOT: ${RUNTIME_ROOT}/storage
      FRONTEND_ORIGIN: http://127.0.0.1:3000,http://localhost:3000
      FRONTEND_URL: http://127.0.0.1:3000
      SMTP_ADDRESS: 127.0.0.1
      SMTP_PORT: "1025"
      SMTP_AUTHENTICATION: none
      SMTP_ENABLE_STARTTLS_AUTO: "false"
      MAIL_FROM: Mitsubachi <no-reply@localhost>

  front:
    cwd: ${FRONT_ROOT}
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 127.0.0.1
      - --port
      - "3000"
      - --strictPort
    port: 3000
    healthcheck: http://127.0.0.1:3000/
    env:
      VITE_API_BASE_URL: http://127.0.0.1:8080

  nginx:
    cwd: ${DEVKIT_ROOT}
    command:
      - nginx
      - -p
      - ${RUNTIME_ROOT}/nginx/
      - -c
      - ${RUNTIME_ROOT}/nginx/nginx.conf
      - -g
      - daemon off;
    port: 8080
    healthcheck: http://127.0.0.1:8080/devkit/health

  adminer:
    cwd: ${RUNTIME_ROOT}/adminer
    command:
      - php
      - -S
      - 127.0.0.1:8081
      - -t
      - ${RUNTIME_ROOT}/adminer
    port: 8081
    healthcheck: http://127.0.0.1:8081/

  mailpit:
    cwd: ${DEVKIT_ROOT}
    command:
      - mailpit
      - --smtp
      - 127.0.0.1:1025
      - --listen
      - 127.0.0.1:8025
      - --database
      - ${RUNTIME_ROOT}/mailpit.db
    port: 8025
    ports:
      - 1025
      - 8025
    healthcheck: http://127.0.0.1:8025/
